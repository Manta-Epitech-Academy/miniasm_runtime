server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The app is served under an arbitrary path prefix by the workshop platform
    # (/runtime/<id>/<version>/), so every URL in it is relative. Nothing here
    # may assume it sits at the origin root.
    # A plain multi-file static app, not a client-routed SPA: a missing asset
    # must be a 404, not index.html served with a 200.
    location / {
        try_files $uri $uri/ =404;
    }

    # Monaco and Blockly are vendored and content-addressed by their pinned
    # version, so they can be cached hard.
    location /vendor/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
