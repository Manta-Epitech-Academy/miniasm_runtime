server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects stay relative: behind TLS-terminating ingress, nginx sees http.
    absolute_redirect off;

    # The platform shows this app in a same-origin iframe: SAMEORIGIN, not DENY.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Standalone convenience (docker run): land on the app.
    location = / {
        return 302 /runtime/miniasm/latest/;
    }

    # The app is served under /runtime/miniasm/latest/ — the path the workshop
    # platform embeds it at (/runtime/<id>/<version>/, same origin as CTFd).
    # Every URL in the app is relative, so it works at any prefix; the files
    # simply live at that path under the document root.
    # A plain multi-file static app, not a client-routed SPA: a missing asset
    # must be a 404, not index.html served with a 200.
    # Exact match, so the bare path is not read as a version by the regex below
    # (which would redirect it to itself).
    location = /runtime/miniasm/latest {
        return 301 /runtime/miniasm/latest/;
    }

    # The URL says "latest", so it cannot promise unchanging content. Cache
    # policy by kind of file — every nested location restates the frame
    # headers because an add_header in a location replaces the inherited set.
    #
    # `^~` so the version-redirect regex below is not consulted for this prefix.
    location ^~ /runtime/miniasm/latest/ {
        # Default, for the app's own files (no hash in their names): always
        # revalidate, 304 on the ETag.
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ =404;

        # The entry page: never stored.
        location = /runtime/miniasm/latest/index.html {
            add_header Cache-Control "no-store" always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header X-Content-Type-Options nosniff always;
        }

        # Monaco, Blockly and dockview are vendored at a pinned version, so
        # they can be cached hard.
        location /runtime/miniasm/latest/vendor/ {
            add_header Cache-Control "public, max-age=2592000, immutable" always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header X-Content-Type-Options nosniff always;
        }
    }

    # Any other version of this runtime (a subject still pinning a commit sha)
    # goes to the one build this image carries.
    location ~ ^/runtime/miniasm/[^/]+(/.*)?$ {
        return 302 /runtime/miniasm/latest$1$is_args$args;
    }
}
